<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline | Smart Safar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111d3d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
    }
    .offline-card {
      background: linear-gradient(145deg, #18284e 0%, #111d3d 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.5rem;
      padding: 2.25rem 1.75rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
    }
    .badge-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: rgba(32, 187, 165, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60ead0;
    }
    .badge-icon svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem; color: #ffffff; }
    p { font-size: 0.88rem; line-height: 1.55; color: #a5b4d4; margin-bottom: 1.75rem; }
    .btn-group { display: flex; flex-direction: column; gap: 0.75rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.25rem;
      border-radius: 0.85rem;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #20bba5; color: #08212d; }
    .btn-primary:hover { opacity: 0.92; }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.16); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.16); }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="badge-icon">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're currently offline</h1>
    <p>Smart Safar saved your previously viewed routes and stops for offline access. Live bus positions and booking require an internet connection.</p>
    <div class="btn-group">
      <a href="/routes" class="btn btn-primary">View saved routes</a>
      <button type="button" onclick="location.reload()" class="btn btn-secondary">Try again</button>
    </div>
  </div>
</body>
</html>
