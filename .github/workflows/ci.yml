name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Validate production API URL
        run: node scripts/check-api-url.cjs
        env:
          AWS_BRANCH: main
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
